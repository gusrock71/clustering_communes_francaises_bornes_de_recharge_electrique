version: 2

sources:
  - name: raw
    description: >
      Tables brutes chargées par ve_pipeline/loading/postgres_loader.py
      depuis S3 (raw/<source>/dt=.../*.csv). Colonnes en TEXT, filtrées via
      _immatriculation_years_to_exclude/KEPT_COLUMNS (contrainte de quota
      Neon, voir le docstring du loader) -- pas de transformation métier à
      ce stade.
    schema: public
    tables:
      - name: raw__irve__irve_consolide
        description: IRVE brut (colonnes utiles au nettoyage/à la jointure uniquement)
      - name: raw__immatriculations__immatriculations_neuf
        description: >
          Immatriculations neuf -- fenêtre glissante de 8 exercices calculée
          à l'exécution (voir postgres_loader._immatriculation_years_to_exclude
          et la macro dbt immat_years()), pas une plage figée.
      - name: raw__immatriculations__immatriculations_occasion
        description: >
          Immatriculations occasion -- fenêtre glissante de 8 exercices
          calculée à l'exécution (voir
          postgres_loader._immatriculation_years_to_exclude et la macro dbt
          immat_years()), pas une plage figée.
      - name: raw__enedis_conso__enedis_conso_commune_2024
        description: Enedis consommation par secteur d'activité/commune, 2024 uniquement
